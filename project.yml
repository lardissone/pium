name: Pium

options:
  bundleIdPrefix: app.pium
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

# Project-wide, so every target signs with the same team. See the file itself
# for why the team is not written here.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Every target needs one: the XCUITest runner cannot be code signed without
    # it, and an unsigned runner is rejected at launch as "damaged".
    GENERATE_INFOPLIST_FILE: YES
    # DEVELOPMENT_TEAM comes from Signing.xcconfig, not from here: a setting
    # written into the generated project would override the xcconfig.
    CODE_SIGN_STYLE: Automatic
    # No App Sandbox: Pium must run local tools, read ~/.config, and search
    # user files. Omitting CODE_SIGN_ENTITLEMENTS entirely is what makes this
    # true — there is no entitlements file to remove.
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Pium:
    type: application
    platform: macOS
    sources:
      - path: Pium
        excludes:
          - "Resources/ExamplePlugins"
      # A folder reference rather than individual files: the examples have to
      # stay in a directory of their own inside the bundle, so a test can read
      # the whole set and a reader can be pointed at one place.
      - path: Pium/Resources/ExamplePlugins
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pium.Pium
        # Menubar agent: no Dock icon, no default main window.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Leandro Ardissone. MIT licensed."

  PiumTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PiumTests
    dependencies:
      - target: Pium
    settings:
      base:
        # Hosting the tests in the app makes `Bundle.main` the app bundle,
        # which the configuration tests rely on.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pium.app/Contents/MacOS/Pium"
        BUNDLE_LOADER: "$(TEST_HOST)"

  PiumUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: PiumUITests
    dependencies:
      - target: Pium
