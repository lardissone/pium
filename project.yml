name: Pium

options:
  bundleIdPrefix: com.lardissone
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # Exact, not `from:`. The resolved-version file Xcode would normally
    # record lives inside Pium.xcodeproj, which is generated and gitignored —
    # so a range would leave the dependency unpinned for CI and for every
    # fresh clone. project.yml is the only reviewable place a version can
    # live, which is the same argument ADR-2 makes for the project itself.
    exactVersion: 2.9.5

# Project-wide, so every target signs with the same team. See the file itself
# for why the team is not written here.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "3"
    # Every target needs one: the XCUITest runner cannot be code signed without
    # it, and an unsigned runner is rejected at launch as "damaged".
    GENERATE_INFOPLIST_FILE: YES
    # DEVELOPMENT_TEAM comes from Signing.xcconfig, not from here: a setting
    # written into the generated project would override the xcconfig.
    CODE_SIGN_STYLE: Automatic
    # No App Sandbox: Pium must run local tools, read ~/.config, and search
    # user files. Omitting CODE_SIGN_ENTITLEMENTS entirely is what makes this
    # true — there is no entitlements file to remove.
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Pium:
    type: application
    platform: macOS
    sources:
      - path: Pium
        excludes:
          - "Resources/ExamplePlugins"
      # A folder reference rather than individual files: the examples have to
      # stay in a directory of their own inside the bundle, so a test can read
      # the whole set and a reader can be pointed at one place.
      - path: Pium/Resources/ExamplePlugins
        type: folder
    dependencies:
      - package: Sparkle
    settings:
      base:
        INFOPLIST_FILE: Pium/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.lardissone.pium
        # The name people see — in Finder, in Spotlight, in an alert macOS
        # raises about the app. The exclamation mark is part of the product
        # name. Only the display name carries it: the bundle stays `Pium.app`
        # and the identifier stays `com.lardissone.pium`, so nothing that resolves
        # the app by path or id has to know about it.
        INFOPLIST_KEY_CFBundleDisplayName: Pium!
        # Menubar agent: no Dock icon, no default main window.
        INFOPLIST_KEY_LSUIElement: YES
        # The catalog is picked up as a resource by the `Pium` source path
        # above; this is what makes one of its sets the application icon.
        # Named here rather than left to the default so a renamed set fails
        # the build instead of silently shipping no icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Leandro Ardissone. MIT licensed."
        # The sentence macOS puts in its own prompt. Without these the prompt
        # carries no explanation. Per folder rather than Full Disk Access,
        # which PRD §9 rules out entirely.
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: "Pium! searches your Documents folder so its files appear in your results."
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: "Pium! searches your Desktop so its files appear in your results."
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: "Pium! searches your Downloads folder so its files appear in your results."
    # Explicit rather than XcodeGen's auto-generated scheme, so the test
    # action can declare an environment variable: `xcodebuild test` does not
    # forward its own shell environment to a macOS test host on its own, so
    # without this `CI` would be invisible to `ProcessInfo` inside the tests
    # that use it (PIUM-50) even when GitHub Actions has set it. `$(CI)`
    # resolves to whatever `CI` is in xcodebuild's own environment when no
    # build setting of that name is defined, which is what makes GitHub
    # Actions' ambient `CI=true` reach the test process unchanged.
    scheme:
      testTargets:
        - PiumTests
      environmentVariables:
        CI: $(CI)
        # Same trick as `CI` above, for the same reason: the latency
        # measurements are off unless asked for, and `xcodebuild` does not
        # forward its own environment to a macOS test host on its own.
        PIUM_MEASURE: $(PIUM_MEASURE)
        # Same again, for the probe that holds Settings open to be photographed.
        PIUM_LOOK: $(PIUM_LOOK)

  PiumTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PiumTests
    dependencies:
      - target: Pium
    settings:
      base:
        # Hosting the tests in the app makes `Bundle.main` the app bundle,
        # which the configuration tests rely on.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pium.app/Contents/MacOS/Pium"
        BUNDLE_LOADER: "$(TEST_HOST)"

  PiumUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: PiumUITests
    dependencies:
      - target: Pium
    settings:
      base:
        # The only entitlements file in the project, and deliberately so: the
        # app has none. This one lets the sandboxed test runner write the
        # fixtures Pium then reads from the real home. See the file itself.
        CODE_SIGN_ENTITLEMENTS: PiumUITests/PiumUITests.entitlements
