name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The runner image's default Xcode is used rather than a pinned path,
      # because those paths change between images. The version is asserted so a
      # drift below Xcode 26 fails here with a clear message instead of later
      # as a confusing compile error.
      - name: Select and verify Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version
          swift --version
          xcodebuild -version | grep -q '^Xcode 26' || {
            echo "::error::Expected Xcode 26 on this runner. Available versions are listed above."
            exit 1
          }

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # PiumUITests is skipped on purpose: XCUITest needs a real GUI session,
      # and Pium additionally needs a registered global hotkey and a floating
      # panel. Those run locally. Do not re-enable this without confirming the
      # runner actually passes.
      - name: Build Debug and run tests
        run: |
          xcodebuild test \
            -project Pium.xcodeproj \
            -scheme Pium \
            -destination 'platform=macOS' \
            -skip-testing:PiumUITests \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release
        run: |
          xcodebuild build \
            -project Pium.xcodeproj \
            -scheme Pium \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO
