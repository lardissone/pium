name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The runner image's default Xcode is used rather than a pinned path,
      # because those paths change between images. The version is asserted so a
      # drift below Xcode 26 fails here with a clear message instead of later
      # as a confusing compile error.
      - name: Select and verify Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version
          swift --version
          xcodebuild -version | grep -q '^Xcode 26' || {
            echo "::error::Expected Xcode 26 on this runner. Available versions are listed above."
            exit 1
          }

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # PiumUITests is not in this scheme at all: it lives in `PiumUI`, which
      # this job deliberately does not run. XCUITest needs a real GUI session,
      # and Pium additionally needs a registered global hotkey and a floating
      # panel — and asking for UI automation makes macOS prompt for a password
      # and wait. Those tests run locally. Do not add that scheme here without
      # confirming the runner actually passes.
      #
      # Within PiumTests, four Spotlight-backed tests (PIUM-50) disable
      # themselves here via `.disabled(if:)` on the `CI` environment variable
      # GitHub Actions sets — a fresh runner has no Spotlight index and there
      # is no cheap way to build one for a VM that is torn down after the job.
      # They still run, and are real coverage, locally. A green run of this
      # job does not exercise the live Spotlight adapter.
      #
      # `CI` reaches the test process only because the scheme's TestAction
      # declares it as an environment variable (see project.yml's `scheme:`
      # block, which XcodeGen turns into `$(CI)` there): `xcodebuild test`
      # does not forward its own shell environment to a macOS test host on
      # its own, so without that declaration `ProcessInfo` would never see it.
      - name: Build Debug and run tests
        run: |
          xcodebuild test \
            -project Pium.xcodeproj \
            -scheme Pium \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release
        run: |
          xcodebuild build \
            -project Pium.xcodeproj \
            -scheme Pium \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO
